name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add the wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Rust core unit tests
        run: cargo test --manifest-path core/Cargo.toml --locked
      - run: npm ci
      - name: Build the Rust/WASM core
        run: npm run build:core
      - name: Record the core checksum
        run: sha256sum public/relay_core.wasm
      - name: Offline test suite
        run: npm test
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: relay-core-wasm
          path: public/relay_core.wasm
          if-no-files-found: error
